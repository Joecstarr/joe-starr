[[sections.subsections]]
name = "Power Distribution Box"
subheader = ""
dates = ""
summary = """Served as developer then technical lead on a MICROSAR (AUTOSAR) powered power 
distribution box (RL78). In my development role I carried out the left side of the ASPICE V SWE life 
cycle for both the application and bootloader layers. Using Enterprise Architect I created internal 
software requirements, both architecture and detailed software designs. Using DaVinci Configurator
and DaVinci Developer I translated my design into a software implementation. In my technical lead 
capacity I conducted code and design reviews for team members. I also analyzed customer (OEM) requirements 
and was the primary contact for customer technical concerns. Finally, I organized, planned, and 
oversaw all technical development efforts. In my oversight duties I fostered strong team bonds by 
leading sprint kickoff and retrospective meetings."""

[[sections.subsections]]
name = "Next Generation Product Kickoff"
subheader = ""
dates = ""
summary = """Conducted next generation product prototyping (Traveo II) and kickoff activities which ensured a 
seamless transition between product versions. Investigated and tested development infrastructure 
such as standard debugger, IDE, and build system. Analyzed customer (OEM) requirements and sourced 
the project AUTOSAR and bootloader stacks. Developed hardware proofing software stack used to flex 
prototype hardware to ensure correctness and compatibility with software requirements."""

[[sections.subsections]]
name = "Infrastructure Development"
subheader = ""
dates = ""
summary = """Developed ASPICE compliant tooling for programmatically parsing customer (OEM) 
requirements documents into enterprise architect, including full traceability analysis and 
reporting of Enterprise Architect models offering the following tracing: customer requirements 
$\leftrightarrow$ use cases $\leftrightarrow$ design $\leftrightarrow$ implementation 
$\leftrightarrow$ validation. Created the build toolchain which allowed for easy targeting of 
multiple environments (real hardware and virtual ECU). Created flexible and fast Jenkins 
configuration to enable both hardware and virtual ECU (PC) testing. Additionally, defined the 
CI/CD quality gates used to qualify software for inclusion into releases and creation of releases.  
"""

[[sections.subsections]]
name = "The Tanglenomicon"
subheader = ""
dates = ""
summary = """Produced a large dataset of objects called arborescent tangles as a portion of my PhD 
research.  My architectural design allowed me to run my generation tooling on various platforms 
such as PC, mobile, browser, and high  performance computing clusters. The tooling I created 
consisted of a collection of flexible and extensibile C libraries. The libraries were then wrapped 
with one of C++, JavaScript, or Python. The tooling was built within a generalized software development 
process and design I created to ensure program correctness and extensibility of the libraries for 
future researchers. This dataset is used by math, physics, and biology researchers as an input to 
their research work."""

